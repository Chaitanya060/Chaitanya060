<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Chaitanya Kishore — Backend Engineering and Cloud Systems</title>
  <desc id="desc">A minimal dark navy profile banner with an abstract technical grid and CK monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.58" stop-color="#111D2E"/>
      <stop offset="1" stop-color="#172B3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82C7D8"/>
      <stop offset="1" stop-color="#5F91C8"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9BB2C8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M820 0H1200V300H930C1010 224 1036 152 820 0Z" fill="#8CB7CA" opacity=".055"/>
  <path d="M900 300L1200 38" stroke="#7CC0D2" stroke-opacity=".18" stroke-width="1.5"/>
  <path d="M980 300L1200 112" stroke="#7CC0D2" stroke-opacity=".12" stroke-width="1.5"/>
  <circle cx="1038" cy="146" r="91" fill="none" stroke="url(#accent)" stroke-opacity=".4" stroke-width="1.5"/>
  <circle cx="1038" cy="146" r="72" fill="none" stroke="#A8C9D8" stroke-opacity=".16" stroke-width="1"/>
  <circle cx="1038" cy="146" r="54" fill="#A8C9D8" fill-opacity=".045" stroke="#A8C9D8" stroke-opacity=".18"/>
  <text x="1038" y="162" text-anchor="middle" fill="#EAF2F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="650" letter-spacing="-3">CK</text>
  <rect x="72" y="62" width="38" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="72" y="123" fill="#F4F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="650" letter-spacing="-1.4">CHAITANYA KISHORE</text>
  <text x="74" y="165" fill="#B9C8D5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="2.3">BACKEND ENGINEERING  /  CLOUD SYSTEMS</text>
  <text x="74" y="220" fill="#8FA5B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing=".3">Designing APIs, data workflows and useful software products.</text>
  <text x="74" y="263" fill="#6F879C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.2">JAVA  ·  SPRING BOOT  ·  PYTHON  ·  AWS</text>
  <rect x="72" y="286" width="1056" height="2" rx="1" fill="#7FB9CA" opacity=".35"/>
