<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Chaitanya Kishore — software engineer</title>
<desc id="desc">A dark, midnight-blue developer portfolio banner with an animated anime-inspired character typing at a coding desk.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset=".58" stop-color="#101B2B"/><stop offset="1" stop-color="#14283A"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17263A"/><stop offset="1" stop-color="#0D1726"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8DE4EF"/><stop offset="1" stop-color="#4D9ED7"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27344D"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#080D18"/></linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34465F"/><stop offset="1" stop-color="#131D2D"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#60C8E8" stop-opacity=".26"/><stop offset="1" stop-color="#60C8E8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9AB5CB" stroke-opacity=".055"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".42"/></filter>
</defs>

<rect width="1200" height="460" rx="22" fill="url(#bg)"/>
<rect width="1200" height="460" rx="22" fill="url(#grid)"/>
<circle cx="968" cy="230" r="230" fill="url(#glow)" filter="url(#soft)"/>
<path d="M0 390H1200" stroke="#9AC6DA" stroke-opacity=".09"/>
<path d="M0 414H1200" stroke="#9AC6DA" stroke-opacity=".05"/>

<!-- Editorial identity panel -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="68" y="72" width="42" height="3" rx="1.5" fill="url(#cyan)"/>
  <text x="68" y="112" fill="#85A9BF" font-size="13" font-weight="600" letter-spacing="3">SOFTWARE ENGINEER  /  INDIA</text>
  <text x="68" y="185" fill="#F3F7FA" font-size="54" font-weight="700" letter-spacing="-2.2">Chaitanya Kishore</text>
  <text x="70" y="229" fill="#B9CAD8" font-size="22" font-weight="500">Backend engineering &amp; cloud systems</text>
  <path d="M70 263H570" stroke="#8ABBCB" stroke-opacity=".3"/>
  <text x="70" y="302" fill="#9CB0C2" font-size="17">Designing APIs, data workflows and useful software.</text>
  <text x="70" y="332" fill="#9CB0C2" font-size="17">Learning by building, testing and shipping real products.</text>
  <g font-size="12" font-weight="600" letter-spacing="1.4">
    <rect x="70" y="370" width="108" height="30" rx="15" fill="#173044" stroke="#4A91AE" stroke-opacity=".55"/>
    <text x="124" y="389" fill="#BCEBF1" text-anchor="middle">JAVA</text>
    <rect x="188" y="370" width="145" height="30" rx="15" fill="#173044" stroke="#4A91AE" stroke-opacity=".55"/>
    <text x="260" y="389" fill="#BCEBF1" text-anchor="middle">SPRING BOOT</text>
    <rect x="343" y="370" width="108" height="30" rx="15" fill="#173044" stroke="#4A91AE" stroke-opacity=".55"/>
    <text x="397" y="389" fill="#BCEBF1" text-anchor="middle">PYTHON</text>
    <rect x="461" y="370" width="78" height="30" rx="15" fill="#173044" stroke="#4A91AE" stroke-opacity=".55"/>
    <text x="500" y="389" fill="#BCEBF1" text-anchor="middle">AWS</text>
  </g>
</g>

<!-- Night workspace -->
<g filter="url(#shadow)">
  <rect x="640" y="34" width="510" height="390" rx="20" fill="url(#panel)" stroke="#7195B4" stroke-opacity=".24"/>
  <rect x="657" y="51" width="476" height="354" rx="13" fill="#0B1422" stroke="#7DB8CE" stroke-opacity=".15"/>
</g>

