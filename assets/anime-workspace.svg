  <text x="886" y="93" fill="#7E9EB7" font-size="8" font-family="monospace">service.java — workspace</text>
  <g font-family="monospace" font-size="10">
    <text x="846" y="123" fill="#7794AD">01</text><text x="866" y="123" fill="#B8A1E8">public class</text><text x="940" y="123" fill="#80CFE0">Application</text><text x="1007" y="123" fill="#B7C9D5">{</text>
    <text x="846" y="143" fill="#7794AD">02</text><text x="881" y="143" fill="#8CC9A8">  @SpringBootApplication</text>
    <text x="846" y="163" fill="#7794AD">03</text><text x="881" y="163" fill="#B8A1E8">  public static void</text><text x="1000" y="163" fill="#80CFE0"> main</text><text x="1032" y="163" fill="#B7C9D5">() {</text>
    <text x="846" y="183" fill="#7794AD">04</text><text x="896" y="183" fill="#B7C9D5">  SpringApplication.run(...);</text>
    <text x="846" y="203" fill="#7794AD">05</text><text x="881" y="203" fill="#B7C9D5">  }</text>
    <text x="846" y="223" fill="#7794AD">06</text><text x="866" y="223" fill="#B7C9D5">}</text>
  </g>
  <rect x="963" y="213" width="7" height="13" fill="#86D7E7">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <path d="M942 258H980L991 273H930Z" fill="#30445B"/>
  <path d="M912 274H1009" stroke="#6A8299" stroke-width="4" stroke-linecap="round"/>
</g>

